<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Templates de E-mail - MovieNizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="email-templates.css" />
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>

  <div class="email-templates-container">

    <!-- Header -->
    <header class="templates-header">
      <h1>Templates de E-mail HTML</h1>
      <div class="header-actions">
        <button id="btn-save-template" class="btn-primary">Salvar Template</button>
        <button id="btn-load-template" class="btn-secondary">Carregar Template</button>
        <button id="btn-preview" class="btn-secondary">Pré-visualizar</button>
        <button id="btn-export" class="btn-secondary">Exportar</button>
      </div>
    </header>

    <!-- Navegação de templates -->
    <div class="templates-nav">
      <button class="template-btn active" data-template="default">Padrão</button>
      <button class="template-btn" data-template="movies">Relatório de Filmes</button>
      <button class="template-btn" data-template="people">Relatório de Pessoas</button>
      <button class="template-btn" data-template="awards">Prêmios e Indicações</button>
      <button class="template-btn" data-template="streaming">Disponibilidade em Plataformas</button>
    </div>

    <!-- Editor de template -->
    <div class="template-editor">
      <div class="editor-section">
        <h3>Personalização</h3>
        <div class="customization-options">
          <div class="option-group">
            <label>Cor de Fundo:</label>
            <input type="color" id="bg-color" value="#ffffff" />
          </div>
          <div class="option-group">
            <label>Cor de Texto:</label>
            <input type="color" id="text-color" value="#333333" />
          </div>
          <div class="option-group">
            <label>Fonte:</label>
            <select id="font-family">
              <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Segoe UI</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="Monaco, monospace">Monaco</option>
            </select>
          </div>
          <div class="option-group">
            <label>Título:</label>
            <input type="text" id="template-title" value="Relatório de Filmes - MovieNizer" />
          </div>
          <div class="option-group">
            <label>Assunto:</label>
            <input type="text" id="email-subject" value="Relatório de Filmes - MovieNizer" />
          </div>
        </div>
      </div>

      <div class="editor-section">
        <h3>Conteúdo do Template</h3>
        <div id="editor"></div>
      </div>
    </div>

    <!-- Pré-visualização -->
    <div class="preview-section" id="preview-section" style="display:none;">
      <h3>Pré-visualização do Template</h3>
      <iframe id="preview-frame" width="100%" height="500px"></iframe>
    </div>

    <!-- Modal para carregar template -->
    <div class="modal" id="load-modal" style="display:none;">
      <div class="modal-content">
        <h3>Carregar Template</h3>
        <select id="template-list">
          <option value="">Selecione um template salvo...</option>
        </select>
        <div class="modal-actions">
          <button id="btn-load-selected" class="btn-primary">Carregar</button>
          <button id="btn-cancel-load" class="btn-secondary">Cancelar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="email-templates.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notificações - MovieNizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="notifications.css" />
</head>
<body>

  <div class="notifications-container">

    <!-- Header -->
    <header class="notifications-header">
      <h1>Notificações</h1>
      <div class="header-actions">
        <button id="btn-mark-all-read" class="btn-secondary">Marcar Todas como Lidas</button>
        <button id="btn-clear-all" class="btn-danger">Limpar Todas</button>
      </div>
    </header>

    <!-- Filtros -->
    <div class="filters-section">
      <div class="filter-group">
        <label>Tipo:</label>
        <select id="filter-type">
          <option value="all">Todas</option>
          <option value="info">Informações</option>
          <option value="success">Sucesso</option>
          <option value="warning">Avisos</option>
          <option value="error">Erros</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Status:</label>
        <select id="filter-status">
          <option value="all">Todas</option>
          <option value="unread">Não Lidas</option>
          <option value="read">Lidas</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Período:</label>
        <select id="filter-period">
          <option value="all">Todo o Período</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>
      </div>
    </div>

    <!-- Lista de Notificações -->
    <div class="notifications-list" id="notifications-list">
      <!-- Notificações serão injetadas aqui -->
    </div>

    <!-- Paginação -->
    <div class="pagination">
      <button id="btn-prev" disabled>Anterior</button>
      <span id="page-info">Página 1 de 1</span>
      <button id="btn-next">Próxima</button>
    </div>

  </div>

  <script src="notifications.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lembretes - MovieNizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="reminders.css" />
</head>
<body>

  <div class="reminders-container">

    <!-- Header -->
    <header class="reminders-header">
      <h1>Lembretes</h1>
      <div class="header-actions">
        <button id="btn-add-reminder" class="btn-primary">+ Adicionar Lembrete</button>
      </div>
    </header>

    <!-- Abas -->
    <div class="tabs">
      <button class="tab active" data-tab="upcoming">Próximos</button>
      <button class="tab" data-tab="overdue">Atrasados</button>
      <button class="tab" data-tab="completed">Completados</button>
      <button class="tab" data-tab="all">Todos</button>
    </div>

    <!-- Lista de Lembretes -->
    <div class="reminders-list" id="reminders-list">
      <!-- Lembretes serão injetados aqui -->
    </div>

    <!-- Modal de Adição/Edição -->
    <div class="modal" id="reminder-modal" style="display:none;">
      <div class="modal-content">
        <h3 id="modal-title">Adicionar Lembrete</h3>
        <form id="reminder-form">
          <input type="hidden" id="reminder-id" />
          <div class="form-group">
            <label>Título:</label>
            <input type="text" id="reminder-title" required />
          </div>
          <div class="form-group">
            <label>Descrição:</label>
            <textarea id="reminder-description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Data e Hora:</label>
            <input type="datetime-local" id="reminder-date" required />
          </div>
          <div class="form-group">
            <label>Recorrente:</label>
            <select id="reminder-recurrence">
              <option value="none">Não</option>
              <option value="daily">Diariamente</option>
              <option value="weekly">Semanalmente</option>
              <option value="monthly">Mensalmente</option>
              <option value="yearly">Anualmente</option>
            </select>
          </div>
          <div class="form-group">
            <label>Relacionado a:</label>
            <select id="reminder-related">
              <option value="none">Nenhum</option>
              <option value="movie">Filme</option>
              <option value="person">Pessoa</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <button type="button" id="btn-cancel-reminder" class="btn-secondary">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script src="reminders.js"></script>
</body>
</html>

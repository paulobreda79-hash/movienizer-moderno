<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Templates Responsivos com Gráficos - MovieNizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive-templates.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body>

  <div class="responsive-templates-container">

    <!-- Header -->
    <header class="templates-header">
      <h1>Templates Responsivos com Gráficos</h1>
      <div class="header-actions">
        <button id="btn-preview" class="btn-primary">Pré-visualizar</button>
        <button id="btn-save-template" class="btn-secondary">Salvar Template</button>
        <button id="btn-load-template" class="btn-secondary">Carregar Template</button>
        <button id="btn-export" class="btn-secondary">Exportar HTML</button>
      </div>
    </header>

    <!-- Navegação de templates -->
    <div class="templates-nav">
      <button class="template-btn active" data-template="dashboard">Dashboard Completo</button>
      <button class="template-btn" data-template="summary">Resumo Estatístico</button>
      <button class="template-btn" data-template="movies">Relatório de Filmes</button>
      <button class="template-btn" data-template="people">Relatório de Pessoas</button>
      <button class="template-btn" data-template="awards">Prêmios e Indicações</button>
    </div>

    <!-- Editor de template -->
    <div class="template-editor">
      <div class="editor-section">
        <h3>Personalização</h3>
        <div class="customization-options">
          <div class="option-group">
            <label>Cor de Fundo:</label>
            <input type="color" id="bg-color" value="#ffffff" />
          </div>
          <div class="option-group">
            <label>Cor de Texto:</label>
            <input type="color" id="text-color" value="#333333" />
          </div>
          <div class="option-group">
            <label>Fonte:</label>
            <select id="font-family">
              <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Segoe UI</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="Monaco, monospace">Monaco</option>
            </select>
          </div>
          <div class="option-group">
            <label>Título:</label>
            <input type="text" id="template-title" value="Relatório de Estatísticas - MovieNizer" />
          </div>
        </div>
      </div>

      <div class="editor-section">
        <h3>Conteúdo do Template</h3>
        <div id="editor"></div>
      </div>

      <!-- Gráficos -->
      <div class="editor-section">
        <h3>Gráficos Integrados</h3>
        <div class="chart-controls">
          <button id="btn-add-chart" class="btn-secondary">Adicionar Gráfico</button>
          <select id="chart-type">
            <option value="bar">Barra</option>
            <option value="doughnut">Doughnut</option>
            <option value="line">Linha</option>
            <option value="pie">Pizza</option>
          </select>
          <select id="chart-data">
            <option value="genres">Filmes por Gênero</option>
            <option value="years">Filmes por Ano</option>
            <option value="ratings">Rating Médio por Gênero</option>
            <option value="roles">Pessoas por Função</option>
          </select>
        </div>
        <div class="charts-container" id="charts-container">
          <!-- Gráficos serão adicionados aqui -->
        </div>
      </div>
    </div>

    <!-- Pré-visualização -->
    <div class="preview-section" id="preview-section" style="display:none;">
      <h3>Pré-visualização do Template</h3>
      <iframe id="preview-frame" width="100%" height="600px"></iframe>
    </div>

    <!-- Modal para carregar template -->
    <div class="modal" id="load-modal" style="display:none;">
      <div class="modal-content">
        <h3>Carregar Template</h3>
        <select id="template-list">
          <option value="">Selecione um template salvo...</option>
        </select>
        <div class="modal-actions">
          <button id="btn-load-selected" class="btn-primary">Carregar</button>
          <button id="btn-cancel-load" class="btn-secondary">Cancelar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="responsive-templates.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estatísticas - MovieNizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="statistics.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="stats-container">

    <!-- Header -->
    <header class="stats-header">
      <h1>Estatísticas da Coleção</h1>
      <div class="header-actions">
        <button id="btn-refresh-data" class="btn-secondary">Atualizar Dados</button>
        <button id="btn-export-data" class="btn-primary">Exportar Dados</button>
      </div>
    </header>

    <!-- Filtros -->
    <div class="filters-section">
      <div class="filter-group">
        <label>Ano:</label>
        <select id="filter-year">
          <option value="all">Todos os anos</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
          <option value="2010-2019">2010-2019</option>
          <option value="2000-2009">2000-2009</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Gênero:</label>
        <select id="filter-genre">
          <option value="all">Todos os gêneros</option>
          <option value="action">Ação</option>
          <option value="comedy">Comédia</option>
          <option value="drama">Drama</option>
          <option value="horror">Terror</option>
          <option value="sci-fi">Ficção Científica</option>
          <option value="romance">Romance</option>
          <option value="thriller">Suspense</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Classificação:</label>
        <select id="filter-rating">
          <option value="all">Todas</option>
          <option value="G">G</option>
          <option value="PG">PG</option>
          <option value="PG-13">PG-13</option>
          <option value="R">R</option>
          <option value="NC-17">NC-17</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Origem:</label>
        <select id="filter-origin">
          <option value="all">Todas</option>
          <option value="us">EUA</option>
          <option value="uk">Reino Unido</option>
          <option value="fr">França</option>
          <option value="de">Alemanha</option>
          <option value="jp">Japão</option>
          <option value="br">Brasil</option>
        </select>
      </div>
    </div>

    <!-- Resumo de Estatísticas -->
    <div class="summary-stats">
      <div class="stat-card">
        <h3>Total de Filmes</h3>
        <p id="total-movies">0</p>
      </div>
      <div class="stat-card">
        <h3>Total de Pessoas</h3>
        <p id="total-people">0</p>
      </div>
      <div class="stat-card">
        <h3>Média de Rating</h3>
        <p id="avg-rating">0.0</p>
      </div>
      <div class="stat-card">
        <h3>Filmes Vistos</h3>
        <p id="movies-watched">0</p>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="charts-container">
      <div class="chart-card">
        <h3>Filmes por Gênero</h3>
        <canvas id="chart-genres"></canvas>
      </div>

      <div class="chart-card">
        <h3>Filmes por Ano</h3>
        <canvas id="chart-years"></canvas>
      </div>

      <div class="chart-card">
        <h3>Rating Médio por Gênero</h3>
        <canvas id="chart-rating-by-genre"></canvas>
      </div>

      <div class="chart-card">
        <h3>Pessoas por Função</h3>
        <canvas id="chart-roles"></canvas>
      </div>
    </div>

    <!-- Rankings -->
    <div class="rankings-container">
      <div class="ranking-section">
        <h3>Top 10 Melhores Filmes</h3>
        <table id="top-movies-table">
          <thead>
            <tr>
              <th>Posição</th>
              <th>Título</th>
              <th>Ano</th>
              <th>Rating</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas serão injetadas aqui -->
          </tbody>
        </table>
      </div>

      <div class="ranking-section">
        <h3>Top 10 Atores Mais Atuados</h3>
        <table id="top-actors-table">
          <thead>
            <tr>
              <th>Posição</th>
              <th>Nome</th>
              <th>Número de Filmes</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas serão injetadas aqui -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="statistics.js"></script>
</body>
</html>

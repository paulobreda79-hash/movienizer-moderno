<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerenciador de Temas - MovieNizer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme-manager.css" />
</head>
<body>

  <div class="theme-manager-container">

    <!-- Header -->
    <header class="theme-header">
      <h1>Gerenciador de Temas</h1>
      <div class="header-actions">
        <button id="btn-toggle-theme" class="btn-secondary">Alternar Tema</button>
        <button id="btn-refresh" class="btn-secondary">Atualizar</button>
      </div>
    </header>

    <!-- Preview do tema atual -->
    <div class="theme-preview">
      <div class="preview-card">
        <h3>Tema Atual</h3>
        <div class="current-theme-info">
          <span id="current-theme-icon" class="theme-icon">☀️</span>
          <div class="theme-details">
            <h4 id="current-theme-name">Claro</h4>
            <p id="current-theme-description">Tema claro padrão</p>
          </div>
        </div>
        <div class="theme-colors" id="theme-colors">
          <!-- Cores serão injetadas aqui -->
        </div>
      </div>
    </div>

    <!-- Lista de temas disponíveis -->
    <div class="themes-section">
      <div class="section-header">
        <h3>Temas Disponíveis</h3>
        <button id="btn-create-theme" class="btn-primary">+ Criar Tema</button>
      </div>
      <div class="themes-grid" id="themes-grid">
        <!-- Temas serão injetados aqui -->
      </div>
    </div>

    <!-- Estatísticas de uso -->
    <div class="stats-section">
      <h3>Estatísticas de Uso</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <h4>Total de Temas</h4>
          <p id="total-themes">0</p>
        </div>
        <div class="stat-card">
          <h4>Mais Usado</h4>
          <p id="most-used-theme">-</p>
        </div>
        <div class="stat-card">
          <h4>Temas Personalizados</h4>
          <p id="custom-themes">0</p>
        </div>
        <div class="stat-card">
          <h4>Sistema</h4>
          <p id="system-theme">-</p>
        </div>
      </div>
    </div>

    <!-- Modal de criação de tema -->
    <div class="modal" id="create-theme-modal" style="display:none;">
      <div class="modal-content">
        <h3>Criar Novo Tema</h3>
        <form id="create-theme-form">
          <div class="form-group">
            <label>Nome do Tema:</label>
            <input type="text" id="theme-name" required />
          </div>
          <div class="form-group">
            <label>Cor Primária:</label>
            <input type="color" id="primary-color" value="#3498db" />
          </div>
          <div class="form-group">
            <label>Cor Secundária:</label>
            <input type="color" id="secondary-color" value="#95a5a6" />
          </div>
          <div class="form-group">
            <label>Cor de Fundo:</label>
            <input type="color" id="background-color" value="#f5f5f5" />
          </div>
          <div class="form-group">
            <label>Cor do Texto:</label>
            <input type="color" id="text-color" value="#333333" />
          </div>
          <div class="form-group">
            <label>Cor das Bordas:</label>
            <input type="color" id="border-color" value="#dddddd" />
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Criar Tema</button>
            <button type="button" id="btn-cancel-create" class="btn-secondary">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de pré-visualização -->
    <div class="modal" id="preview-modal" style="display:none;">
      <div class="modal-content">
        <h3>Pré-visualização do Tema</h3>
        <div class="preview-content" id="preview-content">
          <!-- Conteúdo de pré-visualização -->
        </div>
        <div class="modal-actions">
          <button id="btn-apply-theme" class="btn-primary">Aplicar Tema</button>
          <button id="btn-close-preview" class="btn-secondary">Fechar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="theme-manager.js"></script>
</body>
</html>
